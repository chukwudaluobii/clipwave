# One-click "fully online" deploy on Render (https://render.com).
# In the Render dashboard: New → Blueprint → point at this repo. Render reads this file,
# provisions a Postgres database, builds the Docker image (ffmpeg + yt-dlp included), and
# runs the platform in inline mode. Migrations run automatically on boot.
#
# After deploy, open the service URL and sign in with any email — new users get a Starter
# plan + welcome credits automatically. To go live with real AI, add ANTHROPIC_API_KEY /
# OPENAI_API_KEY in the service's Environment tab and set the provider vars.
#
# NOTE: local disk on hosts is ephemeral (rendered clips are lost on redeploy). For durable
# output set STORAGE_PROVIDER=s3 and the S3_* vars to any S3-compatible bucket (R2, S3, ...).

databases:
  - name: clipwave-db
    databaseName: clipwave
    user: clipwave
    plan: free

services:
  - type: web
    name: clipwave
    runtime: docker
    plan: starter # ffmpeg rendering needs more than the free tier's RAM/CPU
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: clipwave-storage
      mountPath: /data/storage
      sizeGB: 5
    envVars:
      - key: QUEUE_DRIVER
        value: inline
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /data/storage
      - key: DATABASE_URL
        fromDatabase:
          name: clipwave-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: clipwave
          property: host
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: clipwave
          property: host
      # Providers default to stub. Set these (marked sync:false) in the dashboard to go live:
      - key: LLM_PROVIDER
        value: stub
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TRANSCRIPTION_PROVIDER
        value: stub
      - key: OPENAI_API_KEY
        sync: false
