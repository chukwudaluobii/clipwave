# Local infra for Clipwave: Postgres + Redis.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipwave
      POSTGRES_PASSWORD: clipwave
      POSTGRES_DB: clipwave
    ports:
      - "5432:5432"
    volumes:
      - clipwave_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipwave"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - clipwave_redis:/data

volumes:
  clipwave_pg:
  clipwave_redis:
